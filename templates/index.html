<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevSecOps AppSec Lab</title>
</head>

<body>

    <h1>User Search</h1>

    <form method="GET" action="/">
        <input
            type="text"
            name="username"
            placeholder="Enter username"
        >

        <button type="submit">Search</button>
    </form>

    {% if username %}

        <h2>Search Results</h2>

        {% if users %}

            {% for user in users %}
                <p>
                    ID: {{ user["id"] }}<br>
                    Username: {{ user["username"] }}<br>
                    Email: {{ user["email"] }}
                </p>
            {% endfor %}

        {% else %}

            <p>No user found.</p>

        {% endif %}

    {% endif %}

</body>

</html>
